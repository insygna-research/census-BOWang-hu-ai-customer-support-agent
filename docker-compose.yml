version: "3.9"

services:
  # === API 鏈嶅姟 ===
  api:
    build: .
    container_name: cs-agent-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./knowledge_base:/app/knowledge_base
      - chroma_data:/app/chroma_db
    networks:
      - agent_net
    restart: unless-stopped

  # === Streamlit UI ===
  ui:
    build: .
    container_name: cs-agent-ui
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./knowledge_base:/app/knowledge_base
    networks:
      - agent_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  agent_net:
    driver: bridge

volumes:
  chroma_data:
